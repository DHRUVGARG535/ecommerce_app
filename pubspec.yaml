name: ecommerce_app
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.10.4


#------[packages]------
dependencies:
  flutter:
    sdk: flutter

  
  
  cupertino_icons: ^1.0.8
  flutter_native_splash: ^2.4.7
  lottie: ^3.3.2
  get: ^4.7.3
  smooth_page_indicator: ^2.0.1
  iconsax: ^0.0.8
  carousel_slider: ^5.1.2
  readmore: ^3.0.0


  # -----[Firebase]------
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  google_sign_in: ^7.2.0
  cloud_firestore: ^6.1.3
  get_storage: ^2.1.1
  connectivity_plus: ^7.0.0
  shimmer: ^3.0.0
  image_picker: ^1.2.1
  firebase_storage: ^13.1.0
  cached_network_image: ^3.4.1
  path_provider: ^2.1.5
  intl: ^0.20.2
  # flutter_branch_sdk: ^9.1.1
  # flutter_stripe: ^12.4.0
  dio: ^5.9.2
  flutter_launcher_icons: ^0.14.4


#----------------------

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^6.0.0




flutter:
  
  uses-material-design: true
  
#--------[ASSETS]------------

  assets:
    - assets/animations/
    - assets/logo/
    - assets/images/
    - assets/icons/payment_methods/
  

  #--------[FONTS]------------
fonts:
    - family: 'Nunito'
      fonts:
        - asset: assets/fonts/Nunito-Light.ttf
          weight: 300
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Italic.ttf
          style: italic
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 800

  
    

  
  

  
  

  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
